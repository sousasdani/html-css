<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 14</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse;
            width: 600px;
        }

        caption {
            font-size: 1.5em;
            font-weight: bold;
            padding: 10px;
        }

        th, td {
            border: 1px solid #000000;
            padding: 10px;
            text-align: center;
            vertical-align: middle;
        }

        th.color-back {
            color: #ffffff;
            background-color: rgba(68, 67, 67, 0.733);
        }
        
        th#space-no {
            text-align: left;
            vertical-align: left;
        }

        td.no-space {
            text-align: left;
            vertical-align: left;
        }

        td.color-back-1 {
            color: #ffffff;
            background-color: rgba(68, 67, 67, 0.733);
            font-weight: bold;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <caption>Média das notas em cada disciplina</caption>
            <tr>
                <th rowspan="2" class="color-back" scope="col">Área</th>
                <th rowspan="2" class="color-back" scope="col">Disciplinas</th>
                <th colspan="2" class="color-back" scope="colgroup">Notas</th>
                <th rowspan="2" class="color-back" scope="col">Média</th>
            </tr>

            <tr>
                <th class="color-back" scope="col">Nota 1</th>
                <th class="color-back" scope="col">Nota 2</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <th rowspan="4" scope="rowgroup">Exatas</th>
                <td class="no-space">Matématica</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <td class="no-space">Física</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <td class="no-space">Química</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <td class="no-space">Biologia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <th colspan="4" class="color-back" id="space-no" scope="row">Média de Exatas</th>
                <td class="color-back-1">0.0</td>
            </tr>

            <tr>
                <th rowspan="2" scope="rowgroup">Humanas</th>
                <td class="no-space">História</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <td class="no-space">Geografia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <th colspan="4" class="color-back" id="space-no" scope="row">Média de Humanas</th>
                <td class="color-back-1">0.0</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
