<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order flexbox</title>
    <style>
        div.container {
            background-color: rgb(230, 203, 225);
            display: flex;
            flex-flow: row wrap;
            align-items: center;
            height: 300px;
        }
        
        div.item {
            background-color: rgb(171, 216, 216);
            border: 1px solid black;
            padding: 40px;
        }

        div#i1 {
            align-self: flex-start;
        }

        div#i2 {
            align-self: flex-end;
        }

       div#i3 {
            align-self: center;
        }

        div#i4 {
            align-self: flex-end;
        }

        div#i5 {
            align-self: auto;
        }

        div#i6 {
            align-self: flex-start;
        }

        div#i7 {
            align-self: stretch;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
        <div class="item" id="i4">D</div>
        <div class="item" id="i5">E</div>
        <div class="item" id="i6">F</div>
        <div class="item" id="i7">G</div>
    </div>
</body>
</html>
