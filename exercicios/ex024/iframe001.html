<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
    <style>
        iframe {
            width: 400px;
            height: 400px;
        }

        #border {
            border: 3px solid rgb(126, 90, 13);
        }
    </style>
</head>
<body>
    <h1>Testando o uso de um iframe</h1>

    <p>
        O iframe é inline, logo se eu o colocar no meio de um paragráfo, ele vai permanecer nele sem quebrar a linha para uma box-level. 
    </p>

    <iframe src="https://www.cursoemvideo.com" frameborder="500" height="1" srcolling="auto">
        <a href="https://www.cursoemvideo.com" target="_blank">Curso em Video</a>
    </iframe>

    <p>
        O repositório do professor Guanabara também é bem legal
    </p>

    <iframe src="https://gustavoguanabara.github.io" frameborder="0" height="500" width="500">
        <a href="https://gustavoguanabara.github.io" target="_blank">Github</a>
    </iframe>
</body>
</html>
