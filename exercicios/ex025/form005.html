<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário 5</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php" autocomplete="off" required method="get">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="fem" id="ifem" value="F"><label for="ifem">Feminino</label>
            <input type="radio" name="mas" id="imas" value="M"><label for="imas">Masculino</label>
        </fieldset>
        <fieldset>
            <legend>Esportes favoritos</legend>
            <input type="checkbox" name="esbas" id="iesbas" checked> <label for="iesbas">Basquete</label>
            <input type="checkbox" name="esnat" id="iesnat"> <label for="iesnat">Natação</label>
            <input type="checkbox" name="esfut" id="iesfut"> <label for="iesfut">Futebol</label>
            <input type="checkbox" name="esten" id="iesten"> <label for="iesten">Tênis</label>
            <input type="checkbox" name="esvol" id="iesvol"> <label for="iesvol">Vôlei</label>
        </fieldset>
        <p>
            <input type="submit" value="En viar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
