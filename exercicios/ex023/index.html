<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        .table {
            width: 400px;
            border-collapse: collapse;
        }

        .table td {
            border: 1px solid #000000;
            padding: 8px;
        }

        .row-t {
            background-color: #f5f5dc;
        }

        .given-t {
            background-color: #ddc29e;
        }

        .table-two {
            border-collapse: collapse;
        }

        .table-two th {
            background-color: #484d80a8;
            color: #f5f5dc;
            text-shadow: 0.9px 0.9px 0 black;
        }

        .table-two th, td {
            border: 1px solid #000000;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>Minha primeira tabela</h1>
    <table class="table">
        <tr class="row-t">
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>

        <tr>
            <td>A2</td>
            <td class="given-t">B3</td>
            <td>C3</td>
        </tr>

        <tr>
            <td>C1</td>
            <td>C2</td>
            <td>C3</td>
        </tr>

        <tr>
            <td>A4</td>
            <td>B4</td>
            <td>C4 </td>
        </tr>

        <tr>
            <td>A5</td>
            <td>B5</td>
        </tr>
    </table>

    <hr>

    <h2>Minha versão de tabela</h2>

    <table class="table-two">
        <tr>
            <th>Horário</th>
            <th>Segunda-feira</th>
            <th>Terça-feira</th>
            <th>Quarta-feira</th>
            <th>Quinta-feira</th>
            <th>Sexta-feira</th>
            <th>Sábado</th>
            <th>Domingo</th>
        </tr>

        <tr>
            <td>08h20 - 10h40</td>
            <td>Matemática</td>
            <td>Matemática</td>
            <td>História</td>
            <td>Física</td>
            <td>Natação</td>
            <td>Redação</td>
            <td>Descanso</td>
        </tr>
    </table>
</body>
</html>
</body>
</html>
